name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: "2026.8.10"
          cache: ${{ !env.ACT }}
      - name: Verify toolchain pins
        run: |
          test "$(mise exec -- go env GOVERSION)" = "go1.24.13"
          test "$(mise exec -- zig version)" = "0.16.0"
      - name: Install SQLite integration dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev
      - name: Check formatting
        run: mise exec -- zig build fmt-check
      - name: Check release metadata
        run: mise exec -- zig build release-check
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: mise exec -- zig build release-check -Drelease-tag="$GITHUB_REF_NAME"
      - name: Test external package imports
        run: mise exec -- zig build consumer-smoke -Doptimize=ReleaseSafe
      - name: Compile 0.1 API contract in debug
        run: mise exec -- zig build api-freeze
      - name: Compile 0.1 API contract in release-safe
        run: mise exec -- zig build api-freeze -Doptimize=ReleaseSafe
      - name: Run bounded round-trip example
        run: mise exec -- zig build example-round-trip -Doptimize=ReleaseSafe
      - name: Run private-staging apply example
        run: mise exec -- zig build example-apply-snapshot -Doptimize=ReleaseSafe
      - name: Run SQLite-store lifecycle example
        run: mise exec -- zig build example-sqlite-store -Doptimize=ReleaseSafe
      - name: Test canonical source archive
        run: mise exec -- zig build source-archive-smoke -Doptimize=ReleaseSafe
      - name: Check binary fixtures
        run: mise exec -- zig build check-fixtures
      - name: Check historical Go fixtures
        run: mise exec -- zig build check-legacy-fixtures
      - name: Test debug core
        run: mise exec -- zig build test
      - name: Test live SQLite integration in debug
        run: mise exec -- zig build sqlite-integration
      - name: Test release-safe core
        run: mise exec -- zig build test -Doptimize=ReleaseSafe
      - name: Test live SQLite durability integration
        run: mise exec -- zig build sqlite-integration -Doptimize=ReleaseSafe
      - name: Exercise fuzz corpus and native search
        if: runner.os == 'Linux'
        run: |
          if [ "${ACT:-}" = "true" ]; then
            mise exec -- zig build fuzz -Doptimize=ReleaseSafe --seed 0
          else
            mise exec -- zig build fuzz --fuzz=10K -Doptimize=ReleaseSafe --seed 0
          fi
      - name: Build library
        run: mise exec -- zig build -Doptimize=ReleaseSafe
      - name: Verify Zig output with pinned Go oracle
        run: mise exec -- zig build interop -Doptimize=ReleaseSafe
      - name: Install checksum-pinned Litestream reader
        if: runner.os == 'Linux'
        env:
          LITESTREAM_ARCHIVE_SHA256: 9e29112380a942e4a62ee07773684396cb8b308dc4d67e130bef41f75e937f0a
        run: |
          archive="$RUNNER_TEMP/litestream-0.5.16-linux-x86_64.tar.gz"
          install_dir="$RUNNER_TEMP/litestream-v0.5.16"
          curl --fail --location --silent --show-error --output "$archive" \
            https://github.com/benbjohnson/litestream/releases/download/v0.5.16/litestream-0.5.16-linux-x86_64.tar.gz
          printf '%s  %s\n' "$LITESTREAM_ARCHIVE_SHA256" "$archive" | sha256sum --check
          mkdir "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir"
      - name: Restore Zig compaction with Litestream v0.5.16
        if: runner.os == 'Linux'
        run: >-
          mise exec -- zig build litestream-interop -Doptimize=ReleaseSafe
          -Dlitestream="$RUNNER_TEMP/litestream-v0.5.16/litestream"

  portability:
    name: portability (${{ matrix.target }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-windows-gnu
          - aarch64-macos-none
          - wasm32-wasi-musl
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Zig
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: "2026.8.10"
          install_args: zig
      - name: Verify Zig pin
        run: test "$(mise exec zig@0.16.0 -- zig version)" = "0.16.0"
      - name: Compile public module tests
        run: >-
          mise exec zig@0.16.0 -- zig build compile-tests
          -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
