name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - name: Verify toolchain pin
        run: test "$(zig version)" = "0.16.0"
      - name: Check formatting
        run: zig build fmt-check
      - name: Check binary fixtures
        run: zig build check-fixtures
      - name: Test release-safe core
        run: zig build test -Doptimize=ReleaseSafe
      - name: Build library
        run: zig build -Doptimize=ReleaseSafe
      - name: Verify Zig output with pinned Go oracle
        run: zig build interop -Doptimize=ReleaseSafe
